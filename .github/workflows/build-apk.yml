name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/admob

      - name: Download app icon
        run: |
          mkdir -p assets
          curl -L "https://i.postimg.cc/NGXVg23W/fe7cd3b12b5a34f678bb902d00e8f8ba.jpg" -o assets/icon.png

      - name: Add and sync Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure AdMob App ID
        run: |
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</resources>#    <string name="admob_app_id">ca-app-pub-5780570985019889~1755144725</string>\n</resources>#' android/app/src/main/res/values/strings.xml

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kiwiplus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
