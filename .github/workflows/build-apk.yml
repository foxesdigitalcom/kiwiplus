name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Download App Icon
        run: |
          mkdir -p assets
          curl -L "https://i.postimg.cc/NGXVg23W/fe7cd3b12b5a34f678bb902d00e8f8ba.jpg" -o assets/icon.png

      - name: Add and Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      # Without this step, Gradle generates a brand-new random debug keystore
      # on every fresh GitHub Actions runner, so every build is signed with a
      # different key. Android then treats each new APK as a different app
      # and wipes all local data (including saved logins) on install.
      # Restoring this same keystore before every build keeps the app's
      # identity — and therefore its data — consistent across builds.
      - name: Restore persistent debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/workflows/debug.keystore ~/.android/debug.keystore

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwiplus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
